plugins { id 'com.android.application' }
def signing = ['KEYSTORE_PATH','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD'].collectEntries { name -> [(name): System.getenv(name)] }
// Android requires a monotonically increasing versionCode for upgrades.
// Each manual Actions build uses its run number. Local builds use 100000.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def apkVersionCode = 100000 + buildNumber
android {
    namespace 'com.edward9s.raylibforesttest'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.edward9s.raylibforesttest'
        minSdk 26
        targetSdk 35
        versionCode apkVersionCode
        versionName "0.1.${buildNumber}"
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main.assets.srcDirs += ['../../.generated/assets','../../assets/runtime'] }
    signingConfigs {
        release {
            if (signing.KEYSTORE_PATH) storeFile file(signing.KEYSTORE_PATH)
            storePassword signing.STORE_PASSWORD
            keyAlias signing.KEY_ALIAS
            keyPassword signing.KEY_PASSWORD
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
}
tasks.register('verifySceneAssets') {
    doLast {
        def names = ['canopy.png', 'environment.png']
        ['ground','stone','bark'].each { surface ->
            ['albedo','normal','arm'].each { map -> names.add("${surface}_${map}.png") }
        }
        names.each { name ->
            def source = file("../../.generated/assets/forest/${name}")
            if (!source.isFile() || source.length() == 0) throw new GradleException("Missing scene texture: ${name}")
        }
        ['forest.vs','surface.fs','foliage.fs','shadow.vs','shadow.fs','sky.vs','sky.fs'].each { name ->
            if (!file("../../assets/runtime/forest/shaders/${name}").isFile()) throw new GradleException("Missing shader: ${name}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifySceneAssets' }
tasks.register('verifyReleaseSigning') {
    doLast {
        signing.each { name,value -> if (!value) throw new GradleException("Missing signing variable: ${name}") }
        if (!file(signing.KEYSTORE_PATH).isFile()) throw new GradleException('Release signing keystore missing')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseSigning' }
