name: Android test build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raylib-forest-test
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare repository release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          umask 077
          file="$RUNNER_TEMP/raylib-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$file"
          test -s "$file"
          keytool -list -keystore "$file" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Install NDK and Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Fetch pinned raylib 6.2
        run: bash scripts/download-raylib.sh
      - name: Prepare CC0 textures and HDR panorama
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/prepare-scene.py
      - name: Test deterministic forest geometry
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc tests/geometry.cpp src/Geometry.cpp -o /tmp/raylib-forest-geometry
          /tmp/raylib-forest-geometry
      - name: Build release arm64 APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/raylib-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK contents and signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libmain.so'
          unzip -l "$apk" | grep -F 'assets/forest/ground_albedo.png'
          unzip -l "$apk" | grep -F 'assets/forest/environment.png'
          unzip -l "$apk" | grep -F 'assets/forest/shaders/forest.vs'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" RaylibForest-test-arm64.apk
      - name: Replace rolling test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=test-build
          apk=RaylibForest-test-arm64.apk
          notes="Latest successful raylib 6.2 build #${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}. Signed arm64 APK. Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "raylib 6.2 test (latest #${GITHUB_RUN_NUMBER})" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title "raylib 6.2 test (latest #${GITHUB_RUN_NUMBER})" --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          fi
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/raylib-release.jks"
